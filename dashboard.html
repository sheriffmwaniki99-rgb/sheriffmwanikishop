<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #121212; color: #fff; }
        input, button { padding: 8px; margin: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        th { background-color: #333; }
        .danger { background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        #searchInput { width: 100%; padding: 10px; margin-bottom: 20px; background-color: #333; border: 1px solid #444; color: white; }
    </style>
</head>
<body>
    <h1>Business Dashboard</h1>
    
    <div>
        <h2 id="totalOrders">Total Orders: 0</h2>
        <h2 id="totalSales">Total Sales: KES 0</h2>
    </div>

    <div>
        <h2>Add Product</h2>
        <input type="text" id="pname" placeholder="Product Name">
        <input type="text" id="pdesc" placeholder="Description">
        <input type="number" id="pprice" placeholder="Price">
        <button id="submitProduct">Add Product</button>
    </div>

    <input type="text" id="searchInput" placeholder="Search products...">

    <table id="productTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="productBody">
            <!-- Products will be rendered here -->
        </tbody>
    </table>

    <script>
        let products = JSON.parse(localStorage.getItem('products')) || [];
        let orders = JSON.parse(localStorage.getItem('orders')) || [];

        function save() {
            localStorage.setItem('products', JSON.stringify(products));
        }

        function renderProducts() {
            const tbody = document.getElementById('productBody');
            tbody.innerHTML = '';
            products.forEach((p, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(p.name)}</td>
                    <td>${escapeHtml(p.desc)}</td>
                    <td>${escapeHtml(p.price)}</td>
                    <td><button class="danger" onclick="deleteProduct(${index})">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderAdmin() {
            document.getElementById('totalOrders').textContent = `Total Orders: ${orders.length}`;
            const totalSales = orders.reduce((sum, o) => sum + (Number(o.price) || 0), 0);
            document.getElementById('totalSales').textContent = `Total Sales: KES ${totalSales.toLocaleString()}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('submitProduct').addEventListener('click', function() {
            const name = document.getElementById('pname').value.trim();
            const desc = document.getElementById('pdesc').value.trim();
            const price = Number(document.getElementById('pprice').value);

            if (!name || !desc || !Number.isFinite(price) || price < 0) {
                alert("Enter a valid product name, description and price.");
                return;
            }

            products.push({ name, desc, price });
            save();
            renderProducts();

            document.getElementById('pname').value = '';
            document.getElementById('pdesc').value = '';
            document.getElementById('pprice').value = '';
            alert("Product added successfully!");
        });

        function deleteProduct(index) {
            if (confirm("Delete this product?")) {
                products.splice(index, 1);
                save();
                renderProducts();
            }
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            const filter = this.value.toLowerCase();
            const rows = document.querySelectorAll('#productBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            });
        });

        renderProducts();
        renderAdmin();
    </script>
</body>
</html>
